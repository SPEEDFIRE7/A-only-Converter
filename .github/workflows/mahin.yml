name: OrangeFox [OFRP] - Decryption

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/<username>/<repo_name>'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch (use master if default)'
        required: true
        default: 'master'
      DEVICE_NAME:
        description: 'Device codename (as in PRODUCT_DEVICE / twrp_<name>.mk)'
        required: true
        default: 'CPH2185'
      DEVICE_PATH:
        description: 'Device path (DEVICE_PATH in BoardConfig.mk)'
        required: true
        default: 'device/OPPO/CPH2185'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      ENABLE_DECRYPTION:
        description: 'Add decryption support to the device tree before building'
        required: true
        default: true
        type: boolean
      FSCRYPT_POLICY:
        description: 'TW_USE_FSCRYPT_POLICY (1 if fstab says ...:v1, 2 if ...:v2)'
        required: true
        default: '1'
        type: choice
        options:
        - '1'
        - '2'
      USE_SYSTEM_VOLD:
        description: 'Fallback: TW_CRYPTO_USE_SYSTEM_VOLD (use the ROM vold if TWRP crypto fails)'
        required: true
        default: false
        type: boolean
      KEYMASTER_BLOBS_URL:
        description: 'Optional: direct link to a .zip/.tar with keymaster/gatekeeper blobs (vendor/... structure) copied into recovery/root'
        required: false
        default: ''
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: false
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check with LDCHECK'
        required: false
        default: 'vendor/bin/hw/android.hardware.keymaster@4.0-service'

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORANGEFOX_ROOT: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      OUTPUT_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}

    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "10G"

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${{ env.ORANGEFOX_ROOT }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Add decryption support to device tree
      if: ${{ inputs.ENABLE_DECRYPTION }}
      env:
        DEVICE_DIR: ${{ env.ORANGEFOX_ROOT }}/${{ inputs.DEVICE_PATH }}
        FSCRYPT_POLICY: ${{ inputs.FSCRYPT_POLICY }}
        USE_SYSTEM_VOLD: ${{ inputs.USE_SYSTEM_VOLD }}
        BLOBS_URL: ${{ inputs.KEYMASTER_BLOBS_URL }}
      run: |
        set -e
        cd "$DEVICE_DIR"
        BC=BoardConfig.mk
        if [ ! -f "$BC" ]; then
          echo "::error::BoardConfig.mk not found in $DEVICE_DIR"
          exit 1
        fi

        # 1) BoardConfig.mk: remove old (commented or not) crypto flags, then add them back enabled
        sed -i -E '/^#?[[:space:]]*(TW_INCLUDE_CRYPTO|TW_INCLUDE_CRYPTO_FBE|TW_USE_FSCRYPT_POLICY|TW_CRYPTO_USE_SYSTEM_VOLD)[[:space:]]*:=/d' "$BC"
        {
          echo ""
          echo "# --- Added by workflow: decryption ---"
          echo "TW_INCLUDE_CRYPTO := true"
          echo "TW_INCLUDE_CRYPTO_FBE := true"
          echo "TW_USE_FSCRYPT_POLICY := ${FSCRYPT_POLICY}"
          if [ "$USE_SYSTEM_VOLD" = "true" ]; then
            echo "TW_CRYPTO_USE_SYSTEM_VOLD := true"
          fi
        } >> "$BC"

        # 2) fstab: fix empty flags like "wait,,avb=..." (double commas)
        find . -path './recovery/*' -type f \( -name 'recovery.fstab' -o -name 'fstab.*' \) | while read -r f; do
          sed -i -E 's/,,+/,/g' "$f"
          echo "--- $f (/data line) ---"
          grep -E '^[^#]*[[:space:]]/data[[:space:]]' "$f" || true
          if ! grep -E '^[^#]*[[:space:]]/data[[:space:]]' "$f" | grep -q 'fileencryption'; then
            echo "::warning::$f: the /data line has no fileencryption= option, decryption will not work with it."
          fi
        done

        # 3) Optional: keymaster / gatekeeper blobs into recovery/root
        if [ -n "$BLOBS_URL" ]; then
          mkdir -p recovery/root
          curl -L --fail --retry 3 -o /tmp/blobs.pkg "$BLOBS_URL"
          T=$(file -b /tmp/blobs.pkg)
          echo "Blobs archive: $T"
          case "$T" in
            *Zip*)  unzip -o /tmp/blobs.pkg -d recovery/root ;;
            *gzip*|*tar*|*XZ*|*bzip2*) tar -xf /tmp/blobs.pkg -C recovery/root ;;
            *) echo "::error::Unsupported blobs archive type: $T"; exit 1 ;;
          esac
          chmod +x recovery/root/vendor/bin/hw/* 2>/dev/null || true
          chmod +x recovery/root/vendor/bin/* 2>/dev/null || true
          echo "--- blobs now in recovery/root/vendor ---"
          find recovery/root/vendor -type f 2>/dev/null | head -n 100 || true
        fi

        echo "--- Crypto flags now in BoardConfig.mk ---"
        grep -nE 'TW_INCLUDE_CRYPTO|TW_USE_FSCRYPT_POLICY|TW_CRYPTO_USE_SYSTEM_VOLD|PLATFORM_VERSION|PLATFORM_SECURITY_PATCH' "$BC" || true

    - name: Building OrangeFox
      run: |
        pushd ${{ env.ORANGEFOX_ROOT }}
        set +e
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        popd

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(TZ=UTC date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if the recovery exists
      if: always()
      run: |
        img_file=$(find "${{ env.OUTPUT_DIR }}" -name "*.img" -print -quit)
        zip_file=$(find "${{ env.OUTPUT_DIR }}" -name "OrangeFox*.zip" -print -quit)
        if [ -f "$img_file" ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum "$img_file" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
        if [ -f "$zip_file" ]; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum "$zip_file" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "::warning::The zip file isn't present but make sure the image is from only after 100% completion in build stage"
        fi

    - name: Upload artifact
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: OFRP-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: |
          ${{ env.OUTPUT_DIR }}/OrangeFox*.img
          ${{ env.OUTPUT_DIR }}/OrangeFox*.zip
          ${{ env.OUTPUT_DIR }}/recovery.img
        if-no-files-found: warn
        retention-days: 7

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@master
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/OrangeFox*.img
          ${{ env.OUTPUT_DIR }}/*.img
          ${{ env.OUTPUT_DIR }}/OrangeFox*.tar
          ${{ env.OUTPUT_DIR }}/OrangeFox*.zip
          ${{ env.OUTPUT_DIR }}/ramdisk-recovery.*
        name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          Decryption step: ${{ inputs.ENABLE_DECRYPTION }} (fscrypt policy ${{ inputs.FSCRYPT_POLICY }}, system vold ${{ inputs.USE_SYSTEM_VOLD }})
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
        prerelease: true

    - name: Run LDCheck
      if: ${{ inputs.LDCHECK }}
      continue-on-error: true
      run: |
        ROOT_DIR="${{ env.ORANGEFOX_ROOT }}/${{ inputs.DEVICE_PATH }}/recovery/root"
        cd "$ROOT_DIR"
        if [ -d "${GITHUB_WORKSPACE}/tools" ]; then
          cp -n "${GITHUB_WORKSPACE}/tools/libneeds" "${GITHUB_WORKSPACE}/tools/ldcheck" .
        else
          echo "::warning::tools/ (libneeds, ldcheck) not found in the repository, skipping."
          exit 0
        fi
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d "${{ inputs.LDCHECKPATH }}"
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
        
